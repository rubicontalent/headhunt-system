<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubiconTalent CRM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-logo">RT</div>
      <div>
        <div class="brand">RubiconTalent CRM</div>
        <div class="brand-sub">AI Headhunt Platform</div>
      </div>
    </div>
    <nav>
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('candidates') }}">Candidates</a>
      <a href="{{ url_for('clients') }}">Clients</a>
      <a href="{{ url_for('jobs') }}">Jobs</a>
      <a href="{{ url_for('placements') }}">Placements</a>
      <a href="{{ url_for('ai_match') }}">AI Match</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
